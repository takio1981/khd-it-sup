@if (checkingPinStatus()) {
  <div class="flex min-h-screen items-center justify-center bg-brand-background">
    <mat-spinner diameter="32" />
  </div>
} @else if (mode() === 'pin') {
  <khd-pin-login-form (usePassword)="onUsePassword($event)" />
} @else {
  <khd-auth-layout heading="เข้าสู่ระบบ" description="ใช้ชื่อผู้ใช้และรหัสผ่านที่ได้รับจากผู้ดูแลระบบ">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-1">
      @if (errorMessage()) {
        <div class="mb-3 flex items-start gap-2 rounded-xl bg-red-500/10 px-3 py-2.5 text-sm text-red-700 dark:text-red-300" role="alert">
          <khd-icon name="exclamation-triangle" [size]="18" class="mt-0.5 shrink-0" />
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>ชื่อผู้ใช้</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        <khd-icon matPrefix name="user-circle" [size]="20" class="ml-3 mr-2 text-neutral-400" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>รหัสผ่าน</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
        <khd-icon matPrefix name="shield-check" [size]="20" class="ml-3 mr-2 text-neutral-400" />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'แสดงรหัสผ่าน' : 'ซ่อนรหัสผ่าน'"
          (click)="hidePassword.set(!hidePassword())"
        >
          <khd-icon [name]="hidePassword() ? 'eye' : 'eye-slash'" [size]="20" class="text-neutral-400" />
        </button>
      </mat-form-field>

      <div class="-mt-2 mb-4 text-right text-sm">
        <a routerLink="/auth/forgot-password" class="font-medium text-brand-primary no-underline hover:underline">ลืมรหัสผ่าน?</a>
      </div>

      <button mat-flat-button type="submit" class="!h-12 !w-full !text-[15px]" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" class="!mr-2 !inline-block" />
        }
        เข้าสู่ระบบ
      </button>
    </form>

    <div below class="mt-4">
      <a mat-stroked-button routerLink="/qr/scanner" class="!h-12 !w-full">
        <khd-icon name="qr-code" [size]="18" class="mr-2" />
        สแกน QR Code แจ้งซ่อม / ยืม-คืนอุปกรณ์
      </a>
    </div>
  </khd-auth-layout>
}
