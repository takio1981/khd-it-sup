<khd-auth-layout>
  <form [formGroup]="form" (ngSubmit)="submit(form.getRawValue().pin)" class="flex flex-col gap-5">
    <div class="text-center">
      <khd-user-avatar [avatarUrl]="marker?.avatarUrl ?? null" [gender]="marker?.gender ?? null" [size]="64" class="mx-auto mb-3 block w-fit" />
      <p class="m-0 text-lg font-semibold text-ink">สวัสดี {{ marker?.fullName }}</p>
      <p class="m-0 mt-1 text-sm text-muted">กรอก PIN 6 หลักเพื่อเข้าสู่ระบบ</p>
    </div>

    @if (errorMessage()) {
      <div class="flex items-start justify-center gap-2 rounded-xl bg-red-500/10 px-3 py-2.5 text-center text-sm text-red-700 dark:text-red-300" role="alert">
        <khd-icon name="exclamation-triangle" [size]="18" class="mt-0.5 shrink-0" />
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <khd-pin-input formControlName="pin" (completed)="submit($event)" />

    <button mat-flat-button type="submit" class="!h-12 !w-full !text-[15px]" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" class="!mr-2 !inline-block" />
      }
      เข้าสู่ระบบ
    </button>

    <button type="button" class="cursor-pointer border-0 bg-transparent text-sm font-medium text-brand-primary hover:underline" (click)="switchToPassword()">
      ไม่ใช่ {{ marker?.fullName }}? เข้าสู่ระบบด้วยรหัสผ่าน
    </button>
  </form>

  <div below class="mt-4">
    <a mat-stroked-button routerLink="/qr/scanner" class="!h-12 !w-full">
      <khd-icon name="qr-code" [size]="18" class="mr-2" />
      สแกน QR Code แจ้งซ่อม / ยืม-คืนอุปกรณ์
    </a>
  </div>
</khd-auth-layout>
