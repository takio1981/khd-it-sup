@if (submitted()) {
  <khd-auth-layout>
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-600">
        <khd-icon name="paper-airplane" [size]="26" />
      </span>
      <h1 class="m-0 text-xl font-semibold text-ink">ส่งคำขอเรียบร้อยแล้ว</h1>
      <p class="m-0 text-sm text-muted">
        หากมีบัญชีนี้อยู่ในระบบ เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลที่ลงทะเบียนไว้แล้ว กรุณาตรวจสอบกล่องจดหมาย
        (รวมถึงถังขยะ/สแปม) ลิงก์จะหมดอายุภายใน 30 นาที
      </p>
      <a mat-stroked-button routerLink="/auth/login" class="!mt-2 !w-full">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </khd-auth-layout>
} @else {
  <khd-auth-layout
    heading="ลืมรหัสผ่าน"
    description="กรอกชื่อผู้ใช้หรืออีเมลที่ลงทะเบียนไว้ เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้ทางอีเมล"
    backLink="/auth/login"
    backLabel="กลับไปหน้าเข้าสู่ระบบ"
  >
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-1">
      @if (errorMessage()) {
        <div class="mb-3 rounded-xl bg-red-500/10 px-3 py-2.5 text-sm text-red-700 dark:text-red-300" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>ชื่อผู้ใช้หรืออีเมล</mat-label>
        <input matInput formControlName="usernameOrEmail" autocomplete="username" />
      </mat-form-field>

      <button mat-flat-button type="submit" class="!h-12 !w-full" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" class="!mr-2 !inline-block" />
        }
        ส่งลิงก์ตั้งรหัสผ่านใหม่
      </button>
    </form>
  </khd-auth-layout>
}
