# Nginx config ภายใน frontend container — serve Angular static build (SPA fallback)
# หมายเหตุ: นี่คนละไฟล์กับ docker/nginx/nginx.conf ซึ่งเป็น reverse proxy ระดับบนสุด
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # default_type ผูกเฉพาะ location นี้เท่านั้น — ไม่แตะตาราง mime.types ของทั้ง server (ต่างจาก types{} ที่จะ replace ตารางทั้งหมด)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Service worker + ngsw manifest ต้องไม่ cache ยาว ไม่งั้น client จะไม่เห็นแอปเวอร์ชันใหม่หลัง deploy
  location ~* ^/(ngsw-worker\.js|ngsw\.json)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
