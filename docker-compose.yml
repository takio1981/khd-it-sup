name: khd-it-sup

services:
  mariadb:
    image: mariadb:11
    container_name: khd_it_sup_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-khd_it_sup}
      MARIADB_USER: ${MARIADB_USER:-khd_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme_root}
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [khd-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khd_it_sup_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: KHD-IT-SUP
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      DATABASE_URL: mysql://${MARIADB_USER:-khd_app}:${MARIADB_PASSWORD:-changeme}@mariadb:3306/${MARIADB_DATABASE:-khd_it_sup}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-3000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-50}
      PIN_LOGIN_RATE_LIMIT_MAX: ${PIN_LOGIN_RATE_LIMIT_MAX:-100}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      QR_AES_SECRET: ${QR_AES_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-KHD IT Service Desk}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LOG_LEVEL: info
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    expose:
      - '3000'
    networks: [khd-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: /api/v1
    container_name: khd_it_sup_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - '80'
    networks: [khd-network]

  nginx:
    image: nginx:alpine
    container_name: khd_it_sup_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_SSL_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [khd-network]

networks:
  khd-network:
    driver: bridge

volumes:
  mariadb-data:
  backend-uploads:
  backend-logs:
