# =====================================================================================
# KHD-IT-SUP Reverse Proxy (Nginx)
# ทุกอย่างอยู่ใต้ path prefix /khd-it-sup/ เพื่อให้ deploy ร่วมกับ project อื่นบน domain/server
# เดียวกันได้ (path-based multi-tenant) — /khd-it-sup/ -> frontend, /khd-it-sup/api(-docs)?/,
# /khd-it-sup/socket.io/ -> backend (ตัด prefix ออกก่อน proxy เสมอ เพราะ container ข้างในไม่รู้จัก prefix นี้)
#
# HTTPS (443): บังคับทุก request ผ่าน TLS เสมอ (พอร์ต 80 redirect ไป 443 ทั้งหมด) — จำเป็นเพราะเบราว์เซอร์
# ถือว่า HTTP ธรรมดาผ่าน IP address (ไม่ใช่ localhost) เป็น "insecure context" และปิดกั้น
# navigator.mediaDevices.getUserMedia (กล้อง) เสมอ ไม่มีทาง bypass ได้จากฝั่งเซิร์ฟเวอร์ ต้องมี TLS เท่านั้น
# ใบรับรองเป็น self-signed (ไม่มีโดเมนสาธารณะ ใช้เฉพาะ LAN ภายใน) สร้าง/สร้างใหม่ด้วย docker/nginx/gen-cert.sh
# — ต้องรันสคริปต์นี้ใหม่ทุกครั้งที่ IP ของเครื่อง server เปลี่ยน (DHCP) แล้ว restart nginx
# =====================================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Security headers ระดับ Nginx (เสริมจาก Helmet ฝั่ง backend)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  upstream backend_upstream {
    server backend:3000;
    keepalive 32;
  }

  upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
  }

  # HTTP -> HTTPS redirect เสมอ (ยกเว้น health check ที่ยอมให้ตรวจผ่าน HTTP ตรงๆ ได้ เผื่อเครื่องมือ monitor
  # ภายนอกที่ไม่รองรับ self-signed cert)
  server {
    listen 80;
    server_name _;

    location /khd-it-sup/health {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://backend_upstream;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/khd-it-sup.crt;
    ssl_certificate_key /etc/nginx/certs/khd-it-sup.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ตั้งใจไม่ redirect root ("/") ไปที่ /khd-it-sup/ ให้อัตโนมัติ — ต้องพิมพ์ /khd-it-sup/ เองเท่านั้น
    # ถึงจะเข้าใช้งานได้ (กันไม่ให้ "localhost" เฉย ๆ ใช้งานได้ทันทีตอน deploy จริงที่มีหลาย project)
    location = / {
      return 404;
    }

    # --- Backend REST API ---
    location /khd-it-sup/api/ {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Swagger API Docs ---
    location /khd-it-sup/api-docs {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Backend health check ---
    location /khd-it-sup/health {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://backend_upstream;
    }

    # --- Socket.IO (WebSocket upgrade) ---
    location /khd-it-sup/socket.io/ {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # --- Frontend Angular SPA (static build) ---
    location /khd-it-sup/ {
      rewrite ^/khd-it-sup(/.*)$ $1 break;
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
